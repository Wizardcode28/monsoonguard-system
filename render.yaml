services:
  # Backend API with ML Downscaling
  - type: web
    name: monsoonguard-api
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python app/ml/dataset_generator.py && python app/ml/train_models.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
